name: tests

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check src tests scripts notebooks
      - run: ruff format --check src tests scripts

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with test dependencies
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest -v
      - name: Regenerate figures
        run: python scripts/make_figures.py
        env:
          MPLBACKEND: Agg
      - name: Run validation against CAMB
        run: python scripts/validate.py
        env:
          MPLBACKEND: Agg
      - name: Check committed results tables match the code
        if: matrix.python-version == '3.13'
        run: git diff --exit-code -- results/key_results.md results/validation.md
      - name: Execute notebook top to bottom
        run: jupyter nbconvert --to notebook --execute --output /tmp/executed.ipynb notebooks/recombination_and_decoupling.ipynb

  windows:
    # Fresh-install check on Windows: console encoding and path handling differ from Linux.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install package with test dependencies
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest -v
      - name: Regenerate figures
        run: python scripts/make_figures.py
        env:
          MPLBACKEND: Agg
      - name: Run validation against CAMB
        run: python scripts/validate.py
        env:
          MPLBACKEND: Agg
