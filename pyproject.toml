[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cmb-decoupling"
version = "0.1.0"
description = "Hydrogen recombination (Saha, Peebles) and CMB photon decoupling, validated against CAMB/RECFAST"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sethulekshmi" }]
dependencies = ["numpy>=1.24", "scipy>=1.11", "astropy>=5.3", "matplotlib>=3.7"]

[project.optional-dependencies]
reference = ["camb>=1.5"]
dev = ["camb>=1.5", "pytest>=7", "ruff>=0.5", "jupyter", "nbconvert", "ipykernel"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["archive"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "N"]
ignore = ["N802", "N803", "N806", "N815"]  # physics notation: H0, T, Omega_m, ...
